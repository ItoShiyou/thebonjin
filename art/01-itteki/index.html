<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>一滴 — THE Bonjin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;800&display=swap" rel="stylesheet">
<style>
  :root { --paper:#FFFEFB; --sumi:#201515; --dai:#FF4F00; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--paper); overflow:hidden; }
  body { color:var(--sumi); font-family:"Shippori Mincho B1","Noto Serif CJK JP","Noto Serif JP","Yu Mincho",serif;
    -webkit-font-smoothing:antialiased; cursor:crosshair; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .ui { position:fixed; pointer-events:none; opacity:0; transition:opacity 3s ease 1.2s; mix-blend-mode:multiply; }
  body.on .ui { opacity:1; }
  .mark { left:clamp(20px,3.2vw,48px); bottom:clamp(20px,3.2vw,44px); font-size:13px; letter-spacing:.34em; font-weight:500; }
  .mark i { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--dai); margin-left:.5em; transform:translateY(-1px); }
  .count { right:clamp(20px,3.2vw,48px); bottom:clamp(20px,3.2vw,44px); font-size:11px; letter-spacing:.3em; opacity:.0; text-align:right; }
  body.on .count { opacity:.55; }
  .hint { left:50%; bottom:clamp(20px,3.2vw,44px); transform:translateX(-50%); font-size:11px; letter-spacing:.5em; white-space:nowrap; }
  body.on .hint { opacity:.42; }
  body.touched .hint { opacity:0; transition:opacity 2s ease; }
  .say { position:fixed; top:clamp(28px,9vh,96px); right:clamp(24px,5.2vw,84px); writing-mode:vertical-rl; pointer-events:none;
    font-size:clamp(13px,1.15vw,17px); letter-spacing:.42em; line-height:2.6; height:76vh; mix-blend-mode:multiply; }
  .say span { display:inline-block; opacity:0; filter:blur(10px); transform:translateY(-.5em) scale(1.25);
    transition:opacity 1.8s ease, filter 2.2s ease, transform 2.4s cubic-bezier(.2,.7,.2,1); }
  .say span.in { opacity:.92; filter:blur(0); transform:none; }
  .say span.out { opacity:0; filter:blur(14px); transition-duration:1.1s,1.1s,1.6s; }
  .say em { font-style:normal; color:var(--dai); }
  @media (max-aspect-ratio: 4/5) { .say { font-size:12px; right:16px; top:20px; height:60vh; line-height:2.2; } .hint{ display:none; } }
  .nogl { position:fixed; inset:0; display:none; align-items:center; justify-content:center; font-size:14vw; font-weight:800; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="nogl" id="nogl">凡人</div>
<div class="say" id="say" aria-live="polite"></div>
<div class="ui mark">THE Bonjin<i></i></div>
<div class="ui hint">なぞる　／　落とす</div>
<div class="ui count" id="count"></div>

<script>
(() => {
'use strict';
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { alpha:false, antialias:false, depth:false, stencil:false, powerPreference:'high-performance' });
if (!gl || !gl.getExtension('EXT_color_buffer_float')) { document.getElementById('nogl').style.display = 'flex'; return; }
gl.getExtension('OES_texture_float_linear');

/* ───────────────────────── shaders ───────────────────────── */
const VS = `#version 300 es
in vec2 p; out vec2 vUv; void main(){ vUv = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;
const HEAD = `#version 300 es
precision highp float; precision highp sampler2D; in vec2 vUv; out vec4 o;
`;
const NOISE = `
vec3 hash3(vec3 p){ p = vec3(dot(p,vec3(127.1,311.7,74.7)), dot(p,vec3(269.5,183.3,246.1)), dot(p,vec3(113.5,271.9,124.6)));
  return -1. + 2.*fract(sin(p)*43758.5453123); }
float gn(vec3 p){ vec3 i=floor(p), f=fract(p); vec3 u=f*f*f*(f*(f*6.-15.)+10.);
  return mix(mix(mix(dot(hash3(i),f), dot(hash3(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),
                 mix(dot(hash3(i+vec3(0,1,0)),f-vec3(0,1,0)), dot(hash3(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
             mix(mix(dot(hash3(i+vec3(0,0,1)),f-vec3(0,0,1)), dot(hash3(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),
                 mix(dot(hash3(i+vec3(0,1,1)),f-vec3(0,1,1)), dot(hash3(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z); }
float fbm(vec3 p){ float a=.5, s=0.; for(int i=0;i<4;i++){ s+=a*gn(p); p=p*2.03+vec3(7.1,3.3,1.7); a*=.5; } return s; }
`;
const SRC = {
  // semi-Lagrangian advection (velocity; also MacCormack predictor/corrector steps)
  advect: HEAD + `uniform sampler2D uV, uQ; uniform float dt, diss, aspect;
    void main(){ vec2 v = texture(uV, vUv).xy; vec2 c = vUv - dt*v*vec2(1./aspect,1.);
      o = texture(uQ, c) * diss; }`,
  // MacCormack final combine for dye + condensation of ink into the glyph + fading
  dye: HEAD + NOISE + `uniform sampler2D uV, uQ, uHat, uBar, uG; uniform vec2 px; uniform float dt, aspect, time, form, fade, awayFade, seed;
    void main(){
      vec2 v = texture(uV, vUv).xy; vec2 c = vUv - dt*v*vec2(1./aspect,1.);
      vec4 q = texture(uQ, vUv), qh = texture(uHat, vUv), qb = texture(uBar, vUv);
      vec4 r = qh + .5*(q - qb);
      vec2 st = c/px - .5; vec2 b = (floor(st)+.5)*px;
      vec4 a0=texture(uQ,b), a1=texture(uQ,b+vec2(px.x,0.)), a2=texture(uQ,b+vec2(0.,px.y)), a3=texture(uQ,b+px);
      r = clamp(r, min(min(a0,a1),min(a2,a3)), max(max(a0,a1),max(a2,a3)));
      // glyph condensation: the character seeps out from its own bones, ragged front
      float sharp = texture(uG, vUv).r;
      float core  = textureLod(uG, vUv, 3.5).r;
      float wide  = textureLod(uG, vUv, 6.).r;
      vec2 np = vec2(vUv.x*aspect, vUv.y);
      float n = fbm(vec3(np*5., time*.07+seed)) + .5*gn(vec3(np*22., time*.11+seed));
      float th = 1.15 - form*1.5;
      float front = smoothstep(th, th+.22, core + n*.55);
      float tone = fbm(vec3(np*2.6, seed*3.+time*.02));
      float target = sharp * front * clamp(.62 + 2.4*tone + .3*n, .13, 2.2);
      r.r += (1.-exp(-dt*2.4)) * max(target - r.r, 0.) * step(.001, form);
      // ink that strays far from the character thins out while it is forming
      float away = 1. - smoothstep(.0, .22, wide);
      r.r *= exp(-dt*(fade + awayFade*away));
      r.g *= exp(-dt*(fade*1.5 + .09));
      // soft walls
      vec2 e = min(vUv, 1.-vUv); float w = smoothstep(0., .03, min(e.x,e.y));
      r.rg *= mix(.9, 1., w);
      o = clamp(r, 0., 30.);
    }`,
  curl: HEAD + `uniform sampler2D uV; uniform vec2 px;
    void main(){ float L=texture(uV,vUv-vec2(px.x,0.)).y, R=texture(uV,vUv+vec2(px.x,0.)).y, B=texture(uV,vUv-vec2(0.,px.y)).x, T=texture(uV,vUv+vec2(0.,px.y)).x;
      o = vec4(.5*(R-L-T+B),0.,0.,1.); }`,
  // all body forces: vorticity confinement, ink weight, pull toward glyph, ambient breathing
  force: HEAD + NOISE + `uniform sampler2D uV, uC, uD, uG; uniform vec2 px; uniform float dt, aspect, time, curlK, grav, attract, amb, swirl;
    void main(){
      vec2 v = texture(uV, vUv).xy;
      float L=texture(uC,vUv-vec2(px.x,0.)).x, R=texture(uC,vUv+vec2(px.x,0.)).x, B=texture(uC,vUv-vec2(0.,px.y)).x, T=texture(uC,vUv+vec2(0.,px.y)).x, C=texture(uC,vUv).x;
      vec2 f = .5*vec2(abs(T)-abs(B), abs(R)-abs(L)); f /= length(f)+1e-4; f *= curlK*C; f.y *= -1.;
      v += f*dt;
      vec4 d = textureLod(uD, vUv, 1.); float ink = d.r + d.g;
      v.y -= grav * ink * dt;
      // pull: gradient of the blurred glyph at two scales
      vec2 e1 = vec2(.012/aspect, .012), e2 = vec2(.05/aspect, .05);
      vec2 g1 = vec2(textureLod(uG,vUv+vec2(e1.x,0.),4.).r - textureLod(uG,vUv-vec2(e1.x,0.),4.).r, textureLod(uG,vUv+vec2(0.,e1.y),4.).r - textureLod(uG,vUv-vec2(0.,e1.y),4.).r);
      vec2 g2 = vec2(textureLod(uG,vUv+vec2(e2.x,0.),6.5).r - textureLod(uG,vUv-vec2(e2.x,0.),6.5).r, textureLod(uG,vUv+vec2(0.,e2.y),6.5).r - textureLod(uG,vUv-vec2(0.,e2.y),6.5).r);
      float inside = textureLod(uG, vUv, 2.).r;
      v += attract * dt * min(ink,1.5) * (g1*1.1 + g2*5.) * (1.-.7*inside);
      // brake inside the glyph so the character holds still
      v *= 1. - min(1., attract*dt*5.*inside);
      // ambient breathing (divergence-free curl noise)
      vec2 np = vec2(vUv.x*aspect, vUv.y)*2.2; float e=.01;
      float n1=fbm(vec3(np+vec2(0.,e), time*.05)), n2=fbm(vec3(np-vec2(0.,e), time*.05)), n3=fbm(vec3(np+vec2(e,0.), time*.05)), n4=fbm(vec3(np-vec2(e,0.), time*.05));
      v += (amb + swirl*min(ink,1.)) * dt * vec2(n1-n2, -(n3-n4))/(2.*e);
      o = vec4(v,0.,1.);
    }`,
  div: HEAD + `uniform sampler2D uV; uniform vec2 px;
    void main(){ vec2 c=texture(uV,vUv).xy; float L=texture(uV,vUv-vec2(px.x,0.)).x, R=texture(uV,vUv+vec2(px.x,0.)).x, B=texture(uV,vUv-vec2(0.,px.y)).y, T=texture(uV,vUv+vec2(0.,px.y)).y;
      if(vUv.x-px.x<0.) L=-c.x; if(vUv.x+px.x>1.) R=-c.x; if(vUv.y-px.y<0.) B=-c.y; if(vUv.y+px.y>1.) T=-c.y;
      o = vec4(.5*(R-L+T-B),0.,0.,1.); }`,
  pres: HEAD + `uniform sampler2D uP, uDiv; uniform vec2 px;
    void main(){ float L=texture(uP,vUv-vec2(px.x,0.)).x, R=texture(uP,vUv+vec2(px.x,0.)).x, B=texture(uP,vUv-vec2(0.,px.y)).x, T=texture(uP,vUv+vec2(0.,px.y)).x;
      o = vec4((L+R+B+T-texture(uDiv,vUv).x)*.25,0.,0.,1.); }`,
  grad: HEAD + `uniform sampler2D uP, uV; uniform vec2 px;
    void main(){ float L=texture(uP,vUv-vec2(px.x,0.)).x, R=texture(uP,vUv+vec2(px.x,0.)).x, B=texture(uP,vUv-vec2(0.,px.y)).x, T=texture(uP,vUv+vec2(0.,px.y)).x;
      vec2 v = texture(uV,vUv).xy - .5*vec2(R-L,T-B); o = vec4(clamp(v, -30., 30.),0.,1.); }`,
  scale: HEAD + `uniform sampler2D uQ; uniform float k; void main(){ o = texture(uQ,vUv)*k; }`,
  splat: HEAD + NOISE + `uniform sampler2D uQ; uniform vec2 pt; uniform vec4 val; uniform float rad, aspect, rough, seed;
    void main(){ vec2 p = vUv-pt; p.x*=aspect; float r2 = dot(p,p)/rad;
      float n = rough>0. ? gn(vec3(p*(.9/sqrt(rad)), seed))*rough : 0.;
      float g = exp(-min(r2*max(1.+n*1.6, .3), 60.));
      o = texture(uQ,vUv) + val*g; }`,
  display: HEAD + NOISE + `uniform sampler2D uD; uniform vec2 px; uniform float time, aspect;
    const vec3 PAPER = vec3(1., .99608, .98431), SUMI = vec3(.12549,.08235,.08235), DAI = vec3(1.,.30980,0.);
    void main(){
      vec4 d = texture(uD, vUv);
      // ink hangs in water above the paper: soft shadow cast onto the floor
      vec2 so = vec2(.010/aspect, -.016);
      vec4 s1 = textureLod(uD, vUv+so, 4.5), s2 = textureLod(uD, vUv+so*2.2, 6.5);
      float sh = (1.-exp(-(s1.r+s1.g*.6)*1.3))*.11 + (1.-exp(-(s2.r+s2.g*.6)*1.6))*.07;
      // density gradient → darker wet rim, slightly lighter belly
      vec4 m = textureLod(uD, vUv, 2.5);
      float rim = clamp((d.r - m.r)*1.4, -.25, .6);
      float as = 1.-exp(-max(d.r + rim*d.r, 0.)*2.3);
      float ao = smoothstep(.20, .36, 1.-exp(-d.g*3.));
      as = smoothstep(0., 1., as*1.02);
      vec3 c = mix(PAPER, SUMI, sh*(1.-as));
      c = mix(c, DAI, ao*(1.-.0*as));
      c = mix(c, SUMI, as*(1.-.55*ao*(1.-as)));
      o = vec4(c, 1.);
    }`
};

function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s), src.split('\n').slice(0,6).join('\n')); return s; }
const vs = sh(gl.VERTEX_SHADER, VS);
const P = {};
for (const k in SRC) { const pr = gl.createProgram(); gl.attachShader(pr, vs); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, SRC[k])); gl.bindAttribLocation(pr, 0, 'p'); gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr, gl.LINK_STATUS)) console.error(k, gl.getProgramInfoLog(pr));
  const u = {}; const n = gl.getProgramParameter(pr, gl.ACTIVE_UNIFORMS);
  for (let i=0;i<n;i++){ const inf = gl.getActiveUniform(pr,i); u[inf.name] = gl.getUniformLocation(pr, inf.name); }
  P[k] = { pr, u }; }
const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function mkTex(w,h,ifmt,fmt,type,filter){ const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, type, null); return t; }
function mkFbo(w,h,ifmt,fmt,filter=gl.LINEAR){ const tex = mkTex(w,h,ifmt,fmt,gl.HALF_FLOAT,filter); const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); return { tex, fb, w, h, px:[1/w,1/h] }; }
function mkDouble(w,h,ifmt,fmt,filter){ let a = mkFbo(w,h,ifmt,fmt,filter), b = mkFbo(w,h,ifmt,fmt,filter);
  return { get read(){return a;}, get write(){return b;}, swap(){ const t=a; a=b; b=t; } }; }
function delFbo(f){ if(!f) return; gl.deleteTexture(f.tex); gl.deleteFramebuffer(f.fb); }
let unit = 0;
function use(name){ const p = P[name]; gl.useProgram(p.pr); unit = 0; return p.u; }
function bind(loc, tex){ gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(loc, unit); unit++; }
function draw(target){ if(target){ gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb); gl.viewport(0,0,target.w,target.h); }
  else { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0,0,canvas.width,canvas.height); }
  gl.drawArrays(gl.TRIANGLES, 0, 3); }

/* ───────────────────────── resources ───────────────────────── */
let W=0,H=0,aspect=1, vel, pres, divF, curlF, dye, hat, bar, glyphTex, quality = 1;
const gcv = document.createElement('canvas'), gctx = gcv.getContext('2d', { willReadFrequently:false });
let word = '凡人';
function drawGlyph(){
  if(!dye) return;
  const w = dye.read.w, h = dye.read.h; gcv.width = w; gcv.height = h;
  gctx.fillStyle = '#000'; gctx.fillRect(0,0,w,h); gctx.fillStyle = '#fff'; gctx.textAlign='center'; gctx.textBaseline='middle';
  const portrait = w/h < .9; const chars = [...word];
  const fs = portrait ? Math.min(w*.66, h*.36) : Math.min(h*.56, w*.37);
  gctx.font = `800 ${fs}px "Shippori Mincho B1","Noto Serif CJK JP","Noto Serif JP",serif`;
  const cx = w/2, cy = h*.485;
  chars.forEach((ch,i) => { const k = i-(chars.length-1)/2;
    if(portrait) gctx.fillText(ch, cx, cy + k*fs*1.04); else gctx.fillText(ch, cx + k*fs*1.1, cy); });
  if(!glyphTex) glyphTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, glyphTex); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, gl.RED, gl.UNSIGNED_BYTE, gcv); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}
function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  W = Math.max(2, Math.round(innerWidth*dpr)); H = Math.max(2, Math.round(innerHeight*dpr)); canvas.width = W; canvas.height = H; aspect = W/H;
  const simH = 224, sw = Math.max(32, Math.round(simH*aspect));
  const dyeShort = Math.round(Math.min(Math.min(W,H), 1024)*quality);
  const dw = aspect>=1 ? Math.round(dyeShort*aspect) : dyeShort, dh = aspect>=1 ? dyeShort : Math.round(dyeShort/aspect);
  [vel,dye].forEach(d => { if(d){ delFbo(d.read); delFbo(d.write); } }); [pres&&pres.read,pres&&pres.write,divF,curlF,hat,bar].forEach(delFbo);
  vel = mkDouble(sw, simH, gl.RG16F, gl.RG); pres = mkDouble(sw, simH, gl.R16F, gl.RED);
  divF = mkFbo(sw, simH, gl.R16F, gl.RED); curlF = mkFbo(sw, simH, gl.R16F, gl.RED);
  dye = mkDouble(dw, dh, gl.RGBA16F, gl.RGBA, gl.LINEAR_MIPMAP_LINEAR);
  hat = mkFbo(dw, dh, gl.RGBA16F, gl.RGBA); bar = mkFbo(dw, dh, gl.RGBA16F, gl.RGBA);
  [dye.read, dye.write].forEach(f => { gl.bindTexture(gl.TEXTURE_2D, f.tex); gl.generateMipmap(gl.TEXTURE_2D); });
  drawGlyph();
}

/* ───────────────────────── splats & emitters ───────────────────────── */
function splat(target, x, y, val, rad, rough=0){
  const u = use('splat'); bind(u.uQ, target.read.tex); gl.uniform2f(u.pt, x, y); gl.uniform4f(u.val, val[0],val[1],val[2]||0,0);
  gl.uniform1f(u.rad, rad); gl.uniform1f(u.aspect, aspect); gl.uniform1f(u.rough, rough); gl.uniform1f(u.seed, Math.random()*100);
  draw(target.write); target.swap();
}
const emitters = [];
// a falling drop: a short-lived source that travels, leaving ink and momentum
function drop(x, y, vx, vy, opt={}){
  emitters.push(Object.assign({ x, y, vx, vy, life:.55, age:0, ink:1.1, orange:0, rad:.0007, push:1, burst:0, by:-1 }, opt));
}
function burst(x, y, power=1, orange=1.4){
  const n = 11, off = Math.random()*6.28;
  for(let i=0;i<n;i++){ const a = off + i/n*6.283 + (Math.random()-.5)*.4, s = (.9+Math.random()*1.3)*power;
    const dx = Math.cos(a), dy = Math.sin(a);
    splat(vel, x+dx*.03/aspect, y+dy*.03, [dx*s*4.6, dy*s*4.6], .003*power);
  }
  splat(dye, x, y, [0, orange*3.5], .00007*power, .5);
  for(let i=0;i<5;i++){ const a=Math.random()*6.28, r=.02+Math.random()*.09*power;
    splat(dye, x+Math.cos(a)*r/aspect, y+Math.sin(a)*r, [0, orange*5.], .000008+Math.random()*.00002, .3); }
}
function stepEmitters(dt){
  for(let i=emitters.length-1;i>=0;i--){ const e = emitters[i]; e.age += dt;
    if(e.delay>0){ e.delay -= dt; e.age = 0; continue; }
    e.x += e.vx*dt/aspect; e.y += e.vy*dt;
    const k = Math.sin(Math.min(1, e.age/e.life)*Math.PI)**.6;
    splat(vel, e.x, e.y, [e.vx*e.push*k*dt*14, e.vy*e.push*k*dt*14], e.rad*2.2);
    splat(dye, e.x, e.y, [e.ink*k*dt*26, e.orange*k*dt*26], e.rad, .7);
    if(e.burst && e.y <= e.by){ burst(e.x, e.y, e.burst, 1.3); emitters.splice(i,1); onBurst(); continue; }
    if(e.age > e.life) emitters.splice(i,1);
  }
}

/* ───────────────────────── choreography ───────────────────────── */
const WORDS = ['凡人','途中'];
const SAY = ['人は結果ではなく、<em>途中</em>に救われる。', 'だから、<em>途中</em>を消さない社会を作る。'];
const sayEl = document.getElementById('say'), countEl = document.getElementById('count');
let grav = .16, cycle = 0, T = 0, form = 0, attract = 0, fade = .03, awayFade = 0, swirl = 0, broke = false, said = false, drops = 0, seed = Math.random()*50;
const cue = {};
const KAN = ['〇','一','二','三','四','五','六','七','八','九'];
const kan = n => n<10 ? KAN[n] : n<20 ? '十'+(n%10?KAN[n%10]:'') : n<100 ? KAN[Math.floor(n/10)]+'十'+(n%10?KAN[n%10]:'') : String(n);
function countDrop(){ drops++; countEl.textContent = `第${kan(drops)}滴`; }
function say(i){ sayEl.innerHTML = '';
  const tmp = document.createElement('div'); tmp.innerHTML = SAY[i%SAY.length]; let k = 0;
  const walk = (node, parent) => node.childNodes.forEach(c => {
    if(c.nodeType===3) [...c.textContent].forEach(ch => { const s = document.createElement('span'); s.textContent = ch; parent.appendChild(s);
      const d = 190*k++ + Math.random()*120; setTimeout(() => s.classList.add('in'), d); });
    else { const em = document.createElement('em'); parent.appendChild(em); walk(c, em); } });
  walk(tmp, sayEl);
}
function unsay(){ sayEl.querySelectorAll('span').forEach(s => { setTimeout(() => s.classList.add('out'), Math.random()*500);
  s.style.transform = `translate(${(Math.random()-.5)*60}px,${(Math.random()-.5)*60}px) scale(${1+Math.random()*.6})`; }); }
function onBurst(){ if(T > 8 && !broke){ broke = true; T = Math.max(T, TL.breakAt + .01); unsay(); } }
// This piece stands at the very top of the site: the first ink falls almost at once,
// the character is whole by ~8s, and the orange drop breaks it at ~14.5s. One act ≈ 24s.
const TL = { quiet0:.5, form0:1.6, form1:8, sayAt:6.4, breakAt:14.5, end:23 };
function startCycle(){
  T = 0; broke = false; said = false; word = WORDS[cycle % WORDS.length]; seed = Math.random()*50; drawGlyph();
  for(const k in cue) delete cue[k];
}
const once = (k, t, fn) => { if(!cue[k] && T >= t){ cue[k] = 1; fn(); } };
const sm = (a,b,x) => { const t = Math.min(1, Math.max(0, (x-a)/(b-a))); return t*t*(3-2*t); };
function choreo(dt){
  T += dt;
  const q = cycle===0 ? TL.quiet0 : TL.quiet0 + .8;
  const portrait = aspect < .9;
  once('drops', q, () => {
    const n = portrait ? 3 : 5;
    for(let i=0;i<n;i++){ const x = portrait ? .5 + (i-(n-1)/2)*.2 + (Math.random()-.5)*.08 : .5 + (i-(n-1)/2)*.13 + (Math.random()-.5)*.07;
      drop(x, 1.02, (Math.random()-.5)*.12, -(.75+Math.random()*.5), { delay: i===Math.floor(n/2) ? 0 : .3+Math.random()*2.2, ink:.55+Math.random()*.35, life:.3+Math.random()*.25, rad:.00016+Math.random()*.00016, push:1.5 }); }
    countDrop();
  });
  if(!broke){
    form = sm(TL.form0, TL.form1, T) * .98;
    attract = .9*sm(q+.8, q+3, T) * (1 - .55*sm(TL.form1-2, TL.form1+2, T));
    awayFade = .55*sm(TL.form0+2, TL.form1, T);
    fade = .02; swirl = .012*sm(TL.form1, TL.form1+4, T); grav = .15 - .12*sm(TL.form0+1, TL.form1, T);
    once('say', TL.sayAt, () => say(cycle));
    once('fall', TL.breakAt-.42, () => { drop(.5+(Math.random()-.5)*.1, 1.03, 0, -1.35, { orange:2.2, ink:0, life:2, rad:.00003, burst:1.5, by:.5+(Math.random()-.5)*.06, push:1.3 }); });
    if(T > TL.breakAt + 1) { broke = true; unsay(); }
  } else {
    const b = T - TL.breakAt;
    form = 0; attract = 0; awayFade = 0; swirl = .06*(1-sm(0,9,b)); grav = -.012;
    fade = .03 + .8*sm(3.5, 8.6, b);
    if(T > TL.end){ cycle++; startCycle(); }
  }
}

/* ───────────────────────── pointer ───────────────────────── */
const ptr = { x:.5, y:.5, px:.5, py:.5, down:false, moved:false, has:false, downT:0 };
function pos(e){ return [e.clientX/innerWidth, 1 - e.clientY/innerHeight]; }
addEventListener('pointermove', e => { const [x,y] = pos(e); if(!ptr.has){ ptr.px = x; ptr.py = y; ptr.has = true; } ptr.x = x; ptr.y = y; ptr.moved = true; }, { passive:true });
addEventListener('pointerdown', e => { const [x,y] = pos(e); ptr.x = ptr.px = x; ptr.y = ptr.py = y; ptr.has = true; ptr.down = true; ptr.downT = performance.now();
  document.body.classList.add('touched');
  burst(x, y, 1.15, 1.2); countDrop(); }, { passive:true });
addEventListener('pointerup', () => { ptr.down = false; }, { passive:true });
addEventListener('pointerleave', () => { ptr.has = false; });
function stepPointer(dt){
  if(!ptr.moved) return; ptr.moved = false;
  let dx = (ptr.x-ptr.px)*aspect, dy = ptr.y-ptr.py; const dist = Math.hypot(dx,dy); if(dist < 1e-5) return;
  const n = Math.min(8, Math.max(1, Math.ceil(dist/.012)));
  for(let i=1;i<=n;i++){ const t = i/n, x = ptr.px+(ptr.x-ptr.px)*t, y = ptr.py+(ptr.y-ptr.py)*t;
    const sp = Math.min(dist/dt, 6);
    splat(vel, x, y, [dx/dt*.34/n*Math.min(1,dt*60), dy/dt*.34/n*Math.min(1,dt*60)], .0011);
    // a finger dragged through water leaves the faintest thread of ink
    splat(dye, x, y, ptr.down ? [0, 1.2/n*(.4+sp*.3)] : [.05/n*(.3+sp*.35), 0], ptr.down ? .00035 : .00012+sp*.00003, .6);
  }
  ptr.px = ptr.x; ptr.py = ptr.y;
}

/* ───────────────────────── frame ───────────────────────── */
let time = 0;
function step(dt){
  let u;
  choreo(dt); stepEmitters(dt); stepPointer(dt);
  const spx = vel.read.px;
  u = use('curl'); bind(u.uV, vel.read.tex); gl.uniform2fv(u.px, spx); draw(curlF);
  gl.bindTexture(gl.TEXTURE_2D, dye.read.tex); gl.generateMipmap(gl.TEXTURE_2D);
  u = use('force'); bind(u.uV, vel.read.tex); bind(u.uC, curlF.tex); bind(u.uD, dye.read.tex); bind(u.uG, glyphTex);
  gl.uniform2fv(u.px, spx); gl.uniform1f(u.dt, dt); gl.uniform1f(u.aspect, aspect); gl.uniform1f(u.time, time);
  gl.uniform1f(u.curlK, 9.); gl.uniform1f(u.grav, grav); gl.uniform1f(u.attract, attract); gl.uniform1f(u.amb, .0035); gl.uniform1f(u.swirl, swirl);
  draw(vel.write); vel.swap();
  u = use('div'); bind(u.uV, vel.read.tex); gl.uniform2fv(u.px, spx); draw(divF);
  u = use('scale'); bind(u.uQ, pres.read.tex); gl.uniform1f(u.k, .8); draw(pres.write); pres.swap();
  u = use('pres'); gl.uniform2fv(u.px, spx);
  for(let i=0;i<26;i++){ unit = 0; bind(u.uP, pres.read.tex); bind(u.uDiv, divF.tex); draw(pres.write); pres.swap(); }
  u = use('grad'); bind(u.uP, pres.read.tex); bind(u.uV, vel.read.tex); gl.uniform2fv(u.px, spx); draw(vel.write); vel.swap();
  u = use('advect'); bind(u.uV, vel.read.tex); bind(u.uQ, vel.read.tex); gl.uniform1f(u.dt, dt); gl.uniform1f(u.diss, Math.exp(-dt*.22)); gl.uniform1f(u.aspect, aspect); draw(vel.write); vel.swap();
  // dye: MacCormack (keeps the filaments of ink crisp)
  u = use('advect'); bind(u.uV, vel.read.tex); bind(u.uQ, dye.read.tex); gl.uniform1f(u.dt, dt); gl.uniform1f(u.diss, 1); gl.uniform1f(u.aspect, aspect); draw(hat);
  unit = 0; bind(u.uV, vel.read.tex); bind(u.uQ, hat.tex); gl.uniform1f(u.dt, -dt); draw(bar);
  u = use('dye'); bind(u.uV, vel.read.tex); bind(u.uQ, dye.read.tex); bind(u.uHat, hat.tex); bind(u.uBar, bar.tex); bind(u.uG, glyphTex);
  gl.uniform2fv(u.px, dye.read.px); gl.uniform1f(u.dt, dt); gl.uniform1f(u.aspect, aspect); gl.uniform1f(u.time, time);
  gl.uniform1f(u.form, form); gl.uniform1f(u.fade, fade); gl.uniform1f(u.awayFade, awayFade); gl.uniform1f(u.seed, seed);
  draw(dye.write); dye.swap();
}
function render(){
  gl.bindTexture(gl.TEXTURE_2D, dye.read.tex); gl.generateMipmap(gl.TEXTURE_2D);
  const u = use('display'); bind(u.uD, dye.read.tex); gl.uniform2fv(u.px, dye.read.px); gl.uniform1f(u.time, time); gl.uniform1f(u.aspect, aspect); draw(null);
}
let last = 0, slow = 0, fcount = 0;
function frame(now){
  requestAnimationFrame(frame);
  if(!last){ last = now; return; }
  let raw = (now-last)/1000; last = now; const dt = Math.min(raw, 1/30);
  time += dt; step(dt); render();
  // adaptive quality: if the machine struggles, soften the ink rather than stutter
  fcount++; if(fcount > 90){ if(raw > 1/38) slow++; else slow = Math.max(0, slow-1);
    if(slow > 90 && quality > .5){ quality *= .75; slow = 0; fcount = 0; const keepT = T; resize(); T = keepT; } }
}
addEventListener('resize', () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 120); });
window.__art = { get q(){return [quality,form,attract,fade,awayFade,swirl,grav,broke,emitters.length];}, get T(){return T;}, set T(v){T=v;}, burst, drop, get cycle(){return cycle;} };

const boot = () => { resize(); startCycle(); document.body.classList.add('on'); requestAnimationFrame(frame); };
const fontReady = document.fonts && document.fonts.load ? Promise.race([
  document.fonts.load('800 120px "Shippori Mincho B1"', WORDS.join('')), new Promise(r => setTimeout(r, 2500)) ]) : Promise.resolve();
fontReady.then(boot, boot);
})();
</script>
</body>
</html>
